name: LithApps
options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
configs:
  Debug: debug
  Release: release
packages:
  Lith:
    path: .
settings:
  base:
    SWIFT_VERSION: 6.0
targets:
  LithiOS:
    type: application
    platform: iOS
    sources:
      - Apps/LithApp/Sources/Shared
      - Apps/LithApp/Sources/iOS
      - Apps/LithApp/Resources
    dependencies:
      - package: Lith
        product: Lith
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.lith.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lith
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CURRENT_PROJECT_VERSION: 13
        MARKETING_VERSION: 0.1.12
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record audio attached to your notes.
  LithmacOS:
    type: application
    platform: macOS
    sources:
      - Apps/LithApp/Sources/Shared
      - Apps/LithApp/Sources/macOS
      - Apps/LithApp/Resources
    dependencies:
      - package: Lith
        product: Lith
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.lith.macos
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lith
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record audio attached to your notes.
        CODE_SIGN_ENTITLEMENTS: Apps/LithApp/Sources/macOS/LithmacOS.entitlements
        CODE_SIGN_IDENTITY: Apple Development
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 3KG4D4R466
        PROVISIONING_PROFILE_SPECIFIER: ""
        CURRENT_PROJECT_VERSION: 13
        MARKETING_VERSION: 0.1.12
  LithiOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Apps/LithApp/UITests
    dependencies:
      - target: LithiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.lith.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LithiOS
  LithmacOSUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Apps/LithApp/UITests
    dependencies:
      - target: LithmacOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.lith.macos.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: LithmacOS
schemes:
  LithiOS:
    shared: true
    build:
      targets:
        LithiOS: all
        LithiOSUITests: [test]
    test:
      config: Debug
      targets:
        - LithiOSUITests
    run:
      config: Debug
    archive:
      config: Release
  LithmacOS:
    shared: true
    build:
      targets:
        LithmacOS: all
        LithmacOSUITests: [test]
    test:
      config: Debug
      targets:
        - LithmacOSUITests
    run:
      config: Debug
    archive:
      config: Release
